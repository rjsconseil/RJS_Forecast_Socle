<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BPM · Simulation de navigation</title>
  <meta name="description" content="Simulation du Navigation system v2 de RJS Forecast · BPM : sections, pages, sous-pages et sections de sous-page.">
  <link rel="stylesheet" href="sim.css">
</head>
<body>
  <div class="workbench" id="workbench">
    <div class="stage" id="stage">
      <div class="app" id="app">
        <div class="shell">
          <header class="topbar" data-zone-level="l1">
            <button id="burger" class="icon-btn burger" type="button" aria-label="Pages de la section">☰</button>
            <a class="brand" href="#/" aria-label="RJS Forecast · BPM">
              <span class="brand-mark">R</span>
              <span class="brand-text"><strong>RJS Forecast</strong><small>BPM</small></span>
            </a>
            <nav id="sections-nav" class="sections-nav" aria-label="Sections"></nav>
            <div class="top-tools">
              <button id="hist-back" class="icon-btn" type="button" aria-label="Retour dans le parcours" title="Retour">←</button>
              <button id="hist-fwd" class="icon-btn" type="button" aria-label="Suivant dans le parcours" title="Suivant">→</button>
            </div>
          </header>
          <aside id="sidebar" class="sidebar" data-zone-level="l2"></aside>
          <div id="side-scrim" class="side-scrim"></div>
          <main id="main" class="main">
            <div id="masthead" class="masthead"></div>
            <div id="content" class="content"></div>
          </main>
        </div>
        <div id="flyout" class="flyout" hidden></div>
        <div id="form-layer" class="form-layer" hidden></div>
        <div id="toast" class="toast" role="status" hidden></div>
      </div>
    </div>
    <button id="studio-toggle" class="studio-toggle" type="button" aria-controls="studio" aria-expanded="true">
      <span aria-hidden="true">⚙</span><span class="studio-toggle-text">Navigation system</span>
    </button>
    <aside id="studio" class="studio" aria-label="Navigation system"></aside>
  </div>
  <script src="model.js"></script>
  <script src="navigation-system.js"></script>
  <script src="studio.js"></script>
</body>
</html>
