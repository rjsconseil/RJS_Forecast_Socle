# Intégration continue : à chaque push et à chaque PR, les mêmes contrôles qu'en local.
# Aucune donnée réelle : les tests de l'API travaillent sur des bases temporaires.
name: Contrôles

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (tests, contrôle statique)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Base PostgreSQL jetable : les tests du moteur « sgbd » ne tournent que si SOCLE_PG_URL est fournie.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: rjs
          POSTGRES_PASSWORD: rjs
          POSTGRES_DB: socle_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U rjs -d socle_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SOCLE_PG_URL: postgres://rjs:rjs@localhost:5432/socle_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      - run: npm ci
      # Le contrôle statique de l'API utilise le vérificateur TypeScript installé avec le site.
      - run: npm ci --prefix web
      - name: Tests de l'API
        run: npm test
      - name: Contrôle statique de l'API
        run: npm run api:check
      - name: Audit des styles
        run: npm run styles:audit
      # Les quatre jeux d'essai, de bout en bout, sur des bases temporaires (API de recette lancée par le script).
      - name: Jeux d'essai
        run: npm run seeds:check

  web:
    name: Site (tests, build de production)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --prefix web
      # Tests du site avec mesure de couverture : la CI échoue sous le plancher (scripts/coverage-threshold.mjs).
      - name: Tests du site et couverture
        run: npm run test:coverage
        working-directory: web
      - name: Build de production
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: web/dist/web/browser
          retention-days: 3

  e2e:
    name: Interface (site construit, Chromium)
    needs: web
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: web/dist/web/browser
      - name: Chromium
        run: npx playwright-core install --with-deps chromium
      # Site servi comme en production, API de recette et base temporaires, jeux d'essai, puis tests d'interface Astra.
      - name: Tests d'interface
        run: npm run e2e:ci
