# Intégration continue : à chaque push et à chaque PR, les mêmes contrôles qu'en local.
# Aucune donnée réelle : les tests de l'API travaillent sur des bases temporaires.
name: Contrôles

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (tests, contrôle statique)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      - run: npm ci
      # Le contrôle statique de l'API utilise le vérificateur TypeScript installé avec le site.
      - run: npm ci --prefix web
      - name: Tests de l'API
        run: npm test
      - name: Contrôle statique de l'API
        run: npm run api:check
      - name: Audit des styles
        run: npm run styles:audit

  web:
    name: Site (tests, build de production)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --prefix web
      - name: Tests du site
        run: npx ng test --watch=false
        working-directory: web
      - name: Build de production
        run: npm run build
